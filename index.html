<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINNERS NECK – FIN IS HERE</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #00ff87, #60efff, #ffe066);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Header Area */
        .header-container {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 850px;
        }

        .main-title {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            padding: 20px 40px;
            border-radius: 16px;
            color: #ffffff;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 135, 0.6), 0 0 20px rgba(0, 198, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.2); }
            100% { transform: scale(1.02); box-shadow: 0 8px 40px 5px rgba(0, 255, 135, 0.4); }
        }

        .helper-msg {
            margin-top: 15px;
            display: inline-block;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-family: system-ui, sans-serif;
            border: 1px dashed rgba(255,255,255,0.4);
        }

        /* Interactive Canvas */
        #chaos-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Fixed Control Panel */
        .control-panel {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 190px;
        }

        .panel-title {
            color: #5cc8ff;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.25);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-clear {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
        }
        
        .btn-clear:hover {
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="main-title">Chinners Neck – Fin Is Here</div>
        <div class="helper-msg">Images will clip perfectly to circles automatically.</div>
    </div>

    <canvas id="chaos-canvas"></canvas>

    <div class="control-panel">
        <div class="panel-title">Chaos Control</div>
        <button class="btn" id="spawn-text">Spawn Text</button>
        <button class="btn" id="spawn-chin">Spawn Chin</button>
        <button class="btn btn-clear" id="clear-all">Clear</button>
    </div>

    <script>
        const canvas = document.getElementById('chaos-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Target updated image resource asset filename
        const chinImg = new Image();
        chinImg.src = 'IMG_5759.png'; 
        let imgLoaded = false;
        chinImg.onload = () => { imgLoaded = true; };

        // Fallback display if file asset is still loading
        function drawFallbackChin(ctx, x, y, radius) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.clip();
            
            let grad = ctx.createRadialGradient(x, y, radius * 0.1, x, y, radius);
            grad.addColorStop(0, '#ff9a9e');
            grad.addColorStop(1, '#fecfef');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.fillStyle = '#333';
            ctx.font = `bold ${radius * 0.4}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("CHIN", x, y);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        }

        const items = [];
        const wordsPool = ["RAINBOW CHIN", "SPLASH", "BEHOLD", "CHINNERS!", "NECK ATTACK", "GO LOU", "CHAOS"];
        const colorPool = ["#FF5733", "#33FF57", "#3357FF", "#F3FF33", "#FF33F3", "#33FFF0", "#FFFFFF"];

        class ChaosItem {
            constructor(type) {
                this.type = type; 
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.angle = Math.random() * Math.PI * 2;
                this.va = (Math.random() - 0.5) * 0.08; 
                this.radius = Math.floor(Math.random() * 40) + 35;
                
                if (type === 'text') {
                    this.text = wordsPool[Math.floor(Math.random() * wordsPool.length)];
                    this.color = colorPool[Math.floor(Math.random() * colorPool.length)];
                    this.fontSize = Math.floor(Math.random() * 20) + 24;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.va;

                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) this.vx *= -1;
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                if (this.type === 'text') {
                    ctx.font = `bold ${this.fontSize}px 'Arial Black', Impact, sans-serif`;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(0,0,0,0.4)';
                    ctx.shadowBlur = 6;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.text, 0, 0);
                } else {
                    if (imgLoaded) {
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                        ctx.closePath();
                        ctx.clip();
                        ctx.drawImage(chinImg, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
                        
                        ctx.restore();
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    } else {
                        drawFallbackChin(ctx, 0, 0, this.radius);
                    }
                }
                ctx.restore();
            }
        }

        // Structural visual accent lines matching original site orientation
        const bgLines = [
            {x1: 0.15, y1: 0, x2: 0.45, y2: 1, color: 'rgba(255,215,0,0.35)', width: 6},
            {x1: 0.75, y1: 0, x2: 0.95, y2: 1, color: 'rgba(20,50,220,0.25)', width: 8},
            {x1: 0.90, y1: 0, x2: 0.65, y2: 1, color: 'rgba(0,255,100,0.2)', width: 4}
        ];

        function drawBackgroundLines() {
            bgLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x1 * canvas.width, line.y1 * canvas.height);
                ctx.lineTo(line.x2 * canvas.width, line.y2 * canvas.height);
                ctx.strokeStyle = line.color;
                ctx.lineWidth = line.width;
                ctx.stroke();
            });
        }
