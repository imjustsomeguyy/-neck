  <script>
    (function () {

      function randomInt(min, max) {
        return Math.floor(random(min, max + 1));
      }

      function spawnText(big) {
        objects.push({
          type: "text",

          text:
            textPool[
              Math.floor(Math.random() * textPool.length)
            ],

          x: Math.random() * width,
          y: Math.random() * height,

          vx: (Math.random() - 0.5) * 2.8,

          alpha: random(0.3, 0.8)

      }

      function spawnImage(big) {
        objects.push({
          type: "image",

          x: Math.random() * width,
          y: Math.random() * height,

          vx: (Math.random() - 0.5) * 2.6,
          vy: (Math.random() - 0.5) * 2.6,

          angle: Math.random() * Math.PI * 2,
          va: (Math.random() - 0.5) * 0.055,

          radius: big
            ? random(45, 85)
            : random(28, 65),

          alpha: random(0.4, 0.9)
        });
      }

      function spawnParticle(
        x,
        y,
        force,
        imageParticle
      ) {
        var angle = Math.random() * Math.PI * 2;

        var speed =
          force *
          (0.35 + Math.random() * 0.9);

        particles.push({
          x: x,
          y: y,

          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,

          life: 1,
          decay: random(0.012, 0.032),

          size: imageParticle
            ? random(22, 58)
            : random(2, 11),

          rotation: random(0, Math.PI * 2),
          vr: random(-0.2, 0.2),

          image: imageParticle,

          trail: Math.random()
        });
      }

      function updateObjects() {
        for (var i = 0; i < objects.length; i++) {
          var o = objects[i];

          o.x += o.vx;
          o.y += o.vy;

          o.angle += o.va;

          var size = o.radius || o.size;

          if (o.x < size) {
            o.x = size;
            o.vx *= -1;
          }

          if (o.x > width - size) {
            o.x = width - size;
            o.vx *= -1;
          }

          if (o.y < size) {
            o.y = size;
            o.vy *= -1;
          }

          if (o.y > height - size) {
            o.y = height - size;
            o.vy *= -1;
          }
        }
      }

      function updateParticles() {
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];

          p.x += p.vx;
          p.y += p.vy;

          p.vx *= 0.992;
          p.vy *= 0.992;

          p.vy += 0.035;

          p.rotation += p.vr;

          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function drawLasers() {
        ctx.save();

        ctx.lineWidth = 3;
        ctx.globalAlpha = chaosActive ? 0.55 : 0.25;

        var lines = [
          [-100, height * 0.15, width * 0.42, 0],
          [width * 0.55, 0, width + 100, height * 0.22],
          [-100, height * 0.82, width * 0.4, height],
          [width * 0.6, height, width + 100, height * 0.72]
        ];

        for (var i = 0; i < lines.length; i++) {
          var l = lines[i];

          ctx.beginPath();

          ctx.moveTo(l[0], l[1]);
          ctx.lineTo(l[2], l[3]);

          ctx.strokeStyle =
            i % 2 === 0
              ? "#ffffff"
              : "#00fff0";

          ctx.stroke();
        }

        ctx.restore();
      }

      function drawParticles() {
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];

          ctx.save();

          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);

          ctx.globalAlpha = Math.max(0, p.life);

          if (p.image && face.complete && face.naturalWidth) {

              0,

            ctx.clip();

            ctx.drawImage(
              face,
              -p.size / 2,
              -p.size / 2,
              p.size,

            ctx.beginPath();

            ctx.arc(
              0,
              0,
              p.size / 2,
              0,
              Math.PI * 2
            );

            ctx.lineWidth = 3;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
          } else {
            ctx.fillStyle =
              Math.random() > 0.5
                ? "#ffffff"
                : "#00fff0";

            ctx.fillRect(
              -p.size / 2,
              -p.size / 2,
              p.size,
              p.size
            );
          }

          ctx.restore();
        }
      }

      function drawObjects() {
        for (var i = 0; i < objects.length; i++) {
          var o = objects[i];

          ctx.save();

          ctx.translate(o.x, o.y);
          ctx.rotate(o.angle);

          ctx.globalAlpha = o.alpha;

          if (o.type === "text") {
            ctx.font =
              "1000 " +
              o.size +
              "px Arial";

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillStyle = "#ffffff";

            ctx.strokeStyle =
              chaosActive
                ? "rgba(0,255,240,0.5)"
                : "rgba(0,0,0,0.25)";

            ctx.lineWidth =
              chaosActive ? 5 : 4;

            ctx.strokeText(
              o.text,
              0,
              0
            );

            ctx.fillText(
              o.text,
              0,
              0
            );
          }

          if (
            o.type === "image" &&
            face.complete &&
            face.naturalWidth
          ) {
            ctx.beginPath();

            ctx.arc(
              0,
              0,
              o.radius,
              0,
              Math.PI * 2
            );

            ctx.clip();

            ctx.drawImage(
              face,
              -o.radius,
              -o.radius,
              o.radius * 2,
              o.radius * 2
            );

            ctx.beginPath();

            ctx.arc(
              0,
              0,
              o.radius,
              0,
              Math.PI * 2
            );

            ctx.lineWidth = 6;

            ctx.strokeStyle =
              chaosActive
                ? "#00fff0"
                : "#ffffff";

            ctx.stroke();
          }

          ctx.restore();
        }
      }

      function draw() {
        ctx.clearRect(
          0,
          0,
          width,
          height
        );

        drawLasers();
        drawParticles();
        drawObjects();
      }

      function animate() {
        updateObjects();
        updateParticles();

        if (cameraShake > 0) {
          cameraShake *= 0.9;

          if (cameraShake < 0.1) {
            cameraShake = 0;
          }
        }

        var shakeX = 0;
        var shakeY = 0;
        var shakeRotate = 0;

        if (cameraShake > 0) {
          shakeX =
            (Math.random() - 0.5) *
            cameraShake;

          shakeY =
            (Math.random() - 0.5) *
            cameraShake;

          shakeRotate =
            (Math.random() - 0.5) *
            cameraShake *
            0.03;
        }

        shakeLayer.style.transform =
          "translate(" +
          shakeX +
          "px," +
          shakeY +
          "px) rotate(" +
          shakeRotate +
          "deg)";

        draw();

        requestAnimationFrame(animate);
      }

      function triggerFlash() {
        flash.classList.remove("active");

        void flash.offsetWidth;

        flash.classList.add("active");
      }

      function spawnDOMExplosionImages(
        amount,
        centerX,
        centerY
      ) {
        for (var i = 0; i < amount; i++) {
          var img = document.createElement("img");

          img.src = "IMG_5759.png";
          img.className = "explodeImage";

          var angle =
            Math.random() *
            Math.PI *
            2;

          var distance =
            random(50, 120);

          var startX =
            centerX -
            45 +
            Math.cos(angle) *
            25;

          var startY =
            centerY -
            45 +
            Math.sin(angle) *
            25;

          img.style.left =
            startX + "px";

          img.style.top =
            startY + "px";

          img.style.width =
            random(45, 115) + "px";

          img.style.height =
            img.style.width;

          document.body.appendChild(img);

          var duration =
            random(550, 1200);

          var endDistance =
            distance *
            random(5, 14);

          var endX =
            Math.cos(angle) *
            endDistance;

          var endY =
            Math.sin(angle) *
            endDistance;

          var rotation =
            random(-1080, 1080);

          var scale =
            random(0.25, 1.5);

          img.animate(
            [
              {
                transform:
                  "translate(0,0) scale(0.25) rotate(0deg)",
                opacity: 0
              },

              {
                transform:
                  "translate(" +
                  random(-20, 20) +
                  "px," +
                  random(-20, 20) +
                  "px) scale(" +
                  scale +
                  ") rotate(" +
                  random(-90, 90) +
                  "deg)",
                opacity: 1,
                offset: 0.18
              },

              {
                transform:
                  "translate(" +
                  endX +
                  "px," +
                  endY +
                  "px) scale(0.45) rotate(" +
                  rotation +
                  "deg)",
                opacity: 0
              }
            ],
            {
              duration: duration,
              easing: "cubic-bezier(.12,.75,.2,1)"
            }
          ).finished.then(function () {
            if (img.parentNode) {
              img.parentNode.removeChild(img);
            }
          });
        }
      }

      function spawnDebris(
        amount,
        centerX,
        centerY
      ) {
        for (var i = 0; i < amount; i++) {
          var d = document.createElement("div");

          d.className = "debris";

          d.style.left =
            centerX + "px";

          d.style.top =
            centerY + "px";

          document.body.appendChild(d);

          var angle =
            Math.random() *
            Math.PI *
            2;

          var distance =
            random(150, 1000);

          var rotation =
            random(-1400, 1400);

          var duration =
            random(600, 1500);

          var scale =
            random(0.2, 2.5);

          d.animate(
            [
              {
                transform:
                  "translate(-50%,-50%) scale(0) rotate(0deg)",
                opacity: 1
              },

              {
                transform:
                  "translate(-50%,-50%) translate(" +
                  Math.cos(angle) * distance +
                  "px," +
                  Math.sin(angle) * distance +
                  "px) scale(" +
                  scale +
                  ") rotate(" +
                  rotation +
                  "deg)",
                opacity: 0
              }
            ],
            {
              duration: duration,
              easing: "cubic-bezier(.12,.8,.22,1)"
            }
          ).finished.then(function () {
            if (d.parentNode) {
              d.parentNode.removeChild(d);
            }
          });
        }
      }

      function particleExplosion(
        amount,
        force,
        imageParticles
      ) {
        var centerX = width / 2;
        var centerY = height / 2;

        for (var i = 0; i < amount; i++) {
          spawnParticle(
            centerX,
            centerY,
            force,
            imageParticles &&
              i % 2 === 0
          );
        }
      }

      function massiveChaos() {
        chaosActive = true;

        cameraShake = 80;

        chaosOverlay.classList.add("active");

        chaosText.classList.remove("active");
        shockwave.classList.remove("active");
        megaRing.classList.remove("active");

        void chaosText.offsetWidth;
        void shockwave.offsetWidth;
        void megaRing.offsetWidth;

        chaosText.classList.add("active");
        shockwave.classList.add("active");
        megaRing.classList.add("active");

        triggerFlash();

        var centerX = width / 2;
        var centerY = height / 2;

        particleExplosion(
          260,
          11,
          true
        );

        spawnDOMExplosionImages(
          90,
          centerX,
          centerY
        );

        spawnDebris(
          180,
          centerX,
          centerY
        );

        for (var i = 0; i < 45; i++) {
          spawnText(
            true
          );
        }

        for (var j = 0; j < 25; j++) {
          spawnImage(
            true
          );
        }

        /*
          Multiple delayed blast pulses.
          This is what makes it feel more like an actual
          ridiculous chain reaction rather than one animation.
        */

        setTimeout(function () {
          cameraShake = 65;
          triggerFlash();

          particleExplosion(
            120,
            8,
            true
          );

          spawnDOMExplosionImages(
            35,
            centerX,
            centerY
          );
        }, 180);

        setTimeout(function () {
          cameraShake = 52;

          particleExplosion(
            100,
            7,
            true
          );

          spawnDebris(
            70,
            centerX,
            centerY
          );
        }, 360);

        setTimeout(function () {
          cameraShake = 38;

          particleExplosion(
            80,
            5,
            true
          );

          spawnDOMExplosionImages(
            20,
            centerX,
            centerY
          );
        }, 580);

        setTimeout(function () {
          chaosActive = false;
          chaosOverlay.classList.remove("active");
        }, 1100);
      }

      function openCookieClicker() {
        if (!cookieFrame.src.includes(
          "cookieclicker-8uu.pages.dev"
        )) {
          cookieFrame.src =
            "https://cookieclicker-8uu.pages.dev/";
        }

        cookieModal.classList.add("open");

        document.body.style.overflow =
          "hidden";
      }

      function closeCookieClicker() {
        cookieModal.classList.remove("open");

        document.body.style.overflow =
          "hidden";
      }

      chaosButton.addEventListener(
        "click",
        function (event) {
          event.preventDefault();

          massiveChaos();
        }
      );

      cookieButton.addEventListener(
        "click",
        function (event) {
          event.preventDefault();

          openCookieClicker();
        }
      );

      closeCookie.addEventListener(
        "click",
        function () {
          closeCookieClicker();
        }
      );

      cookieModal.addEventListener(
        "click",
        function (event) {
          if (event.target === cookieModal) {
            closeCookieClicker();
          }
        }
      );

      document.addEventListener(
        "keydown",
        function (event) {
          if (
            event.key === "Escape" &&
            cookieModal.classList.contains("open")
          ) {
            closeCookieClicker();
          }
        }
      );

      window.addEventListener(
        "resize",
        resize
      );

      resize();

      for (var t = 0; t < 14; t++) {
        spawnText(false);
      }

      for (var im = 0; im < 7; im++) {
        spawnImage(false);
      }

      /*
        Initial floating chin particles appear once the image
        is loaded. This prevents blank image circles before
        IMG_5759.png has loaded.
      */
      face.onload = function () {
        for (var i = 0; i < 3; i++) {
          spawnImage(true);
        }
      };

      animate();

    })();
  </script>

</body>
